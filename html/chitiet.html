<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../js/lib.js"></script>
	<link rel ="stylesheet" href = "../css/style5.css">
</head>

<body>
    <div class="container mt-5">
        <div class="card p-4">
            <img id="image" class="img-fluid mb-3" style="max-width:400px;">
            <h2 id="nameProduct"></h2>
            <h4 id="price" class="text-primary"></h4>
            <p id="description"></p>
          <a href="page8.html" class="back-btn">Quay về thui!!</a>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const product = Products.find(item => item.id === id);
        if (product) {
            document.getElementById("image").src = product.image;
            document.getElementById("nameProduct").innerHTML = product.nameProduct;
            document.getElementById("price").innerHTML = product.price;
           document.getElementById("description").innerHTML = `
            ${product.description}
            <hr>
            <h5>📌 Thông tin chi tiết:</h5>
            <p>${product.detail}</p>
`;
        }
    </script>
</body>
</html>
